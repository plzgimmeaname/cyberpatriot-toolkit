name: Release range agent

on:
  push:
    tags: ['range-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version-file: site/.node-version
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: python3 -m unittest discover -s tests/range
      - name: Build the package (includes the website)
        run: python3 range/package.py --out out
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/rampart-range.zip out/rampart-range.pyz out/rampart-range.sha256 --title "Rampart Range agent ${GITHUB_REF_NAME#range-v}" --notes "Download rampart-range.zip, unzip, and double-click the launcher. See range/README.md."
