name: Practice range

on:
  pull_request:
    paths: ['range/**', 'tests/range/**', '.github/workflows/range.yml']
  push:
    branches: [main]
    paths: ['range/**', 'tests/range/**', '.github/workflows/range.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test add-image (encrypted ZIP) and PPM to PNG
        run: python -m unittest discover -s tests/range -v
